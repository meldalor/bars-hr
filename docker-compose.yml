name: bars-hr

services:
  postgres:
    image: postgres:16-alpine
    container_name: barshr-postgres
    environment:
      POSTGRES_DB: barshr
      POSTGRES_USER: barshr
      POSTGRES_PASSWORD: barshr_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barshr -d barshr"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: barshr-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=barshr;Username=barshr;Password=barshr_dev"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: barshr-web
    ports:
      - "8080:8080"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4
    container_name: barshr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bars.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: